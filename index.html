<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <title>داشبورد مدیریت یکپارچه | Hideaway • طلای غفاری • Nuance</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * { font-family: 'Vazirmatn', sans-serif !important; }
    body { background-color: #f1f5f9; color: #0f172a; margin: 0; -webkit-tap-highlight-color: transparent; }
    
    @media print {
      body * { visibility: hidden; }
      #printable-invoice, #printable-invoice * { visibility: visible; }
      #printable-invoice {
        position: fixed;
        inset: 0;
        width: 100%;
        background: white !important;
        padding: 24px !important;
        z-index: 999999;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const ref = React.useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const iconEl = document.createElement('i');
          iconEl.setAttribute('data-lucide', name);
          iconEl.className = className;
          ref.current.appendChild(iconEl);
          window.lucide.createIcons({ nodes: [iconEl] });
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0"></span>;
    };

    const WORKSPACES = {
      all: {
        id: 'all',
        name: 'نمای تجمیعی کل',
        shortName: 'نمای کل',
        subtitle: 'گزارش جامع دارایی‌ها، کسب‌وکارها و زندگی شخصی',
        icon: 'layout-dashboard',
        gradient: 'from-slate-900 via-slate-800 to-slate-900',
        pillActive: 'bg-amber-400 text-slate-950 shadow-sm',
        badge: 'bg-slate-800 text-amber-400',
        accentBg: 'bg-slate-900 hover:bg-slate-800',
        categories: {
          income: ['فروش کافه', 'فروش طلا', 'فروش آنلاین‌شاپ', 'سایر درآمدها'],
          expense: ['خرید مواد اولیه', 'خرید طلا و سکه', 'هزینه جاری', 'قبوض', 'سایر هزینه‌ها']
        }
      },
      hideaway: {
        id: 'hideaway',
        name: 'Hideaway',
        shortName: 'Hideaway',
        subtitle: 'مدیریت مالی، بار، ایونت‌ها و کارهای کافه Hideaway',
        icon: 'coffee',
        gradient: 'from-[#1e2d3b] via-[#2f4456] to-[#1a2632]',
        pillActive: 'bg-[#d4af37] text-[#1a2632] shadow-sm',
        badge: 'bg-[#2f4456] text-[#f3e5ab]',
        accentBg: 'bg-[#2f4456] hover:bg-[#233341]',
        categories: {
          income: ['فروش POS کافه', 'فروش نقدی', 'درآمد ورکشاپ و ایونت', 'سفارش بیرون‌بر', 'سایر درآمدهای Hideaway'],
          expense: ['خرید دانه قهوه و بار سرد/گرم', 'خرید کیک و شیرینی', 'حقوق باریستا و پرسنل', 'اجاره و شارژ کافه', 'تبلیغات و تولید محتوا', 'تجهیزات و تعمیرات']
        }
      },
      ghaffari_gold: {
        id: 'ghaffari_gold',
        name: 'طلای غفاری',
        shortName: 'طلای غفاری',
        subtitle: 'حسابداری مغازه طلای غفاری، نرخ تابلو و دفتر مشتریان',
        icon: 'gem',
        gradient: 'from-amber-950 via-amber-900 to-stone-900',
        pillActive: 'bg-amber-400 text-amber-950 shadow-sm',
        badge: 'bg-amber-900 text-amber-200',
        accentBg: 'bg-amber-700 hover:bg-amber-800',
        categories: {
          income: ['فروش طلای زینتی', 'فروش سکه و آبشده', 'دریافت اجرت و سود', 'سایر درآمدهای مغازه'],
          expense: ['خرید طلای آبشده / بنکداری', 'خرید سکه', 'اجرت ساخت کارگاه', 'حقوق و کمیسیون', 'امنیت، بیمه و اجاره مغازه']
        }
      },
      nuance: {
        id: 'nuance',
        name: 'Nuance',
        shortName: 'Nuance',
        subtitle: 'مدیریت فروش آنلاین، بسته‌بندی و مشتریان Nuance',
        icon: 'sparkles',
        gradient: 'from-[#360312] via-[#4c0519] to-[#29020d]',
        pillActive: 'bg-[#e2b857] text-[#360312] shadow-sm',
        badge: 'bg-[#4c0519] text-[#f5d076]',
        accentBg: 'bg-[#4c0519] hover:bg-[#380312]',
        categories: {
          income: ['فروش آنلاین سایت / اینستاگرام', 'سفارش اختصاصی مشتری', 'تسویه درگاه پرداخت', 'سایر درآمدهای Nuance'],
          expense: ['تأمین طلا و متریال', 'چاپ و بسته‌بندی لوکس (زرشکی/طلاکوب)', 'تبلیغات و عکاسی', 'ارسال پستی و پیک بیمه', 'کارمزد درگاه و مالیات']
        }
      },
      home: {
        id: 'home',
        name: 'کارهای خانه',
        shortName: 'خانه',
        subtitle: 'مدیریت مخارج منزل، خریدهای خانه و کارهای روزمره',
        icon: 'home',
        gradient: 'from-emerald-950 via-emerald-900 to-teal-950',
        pillActive: 'bg-emerald-400 text-emerald-950 shadow-sm',
        badge: 'bg-emerald-900 text-emerald-200',
        accentBg: 'bg-emerald-700 hover:bg-emerald-800',
        categories: {
          income: ['بودجه واریزی منزل', 'سایر واریزی‌های خانه'],
          expense: ['خرید سوپرمارکت و میوه', 'پروتئین و مواد غذایی', 'لوازم و تعمیرات منزل', 'شارژ ساختمان و نظافت', 'خرید برای منزل']
        }
      },
      personal: {
        id: 'personal',
        name: 'کارهای شخصی',
        shortName: 'شخصی',
        subtitle: 'حسابداری شخصی، قبوض، اقساط، اهداف و برنامه‌ریزی فردی',
        icon: 'user',
        gradient: 'from-indigo-950 via-indigo-900 to-slate-900',
        pillActive: 'bg-indigo-400 text-indigo-950 shadow-sm',
        badge: 'bg-indigo-950 text-indigo-200',
        accentBg: 'bg-indigo-700 hover:bg-indigo-800',
        categories: {
          income: ['برداشت سود از کسب‌وکار', 'سایر درآمدهای شخصی'],
          expense: [
            'قبض آب',
            'قبض برق',
            'قبض گاز',
            'قبض تلفن همراه',
            'قبض اینترنت',
            'پوشاک و خرید شخصی',
            'ورزش و سلامت',
            'تفریح، سینما و کتاب',
            'حمل‌ونقل و خودرو',
            'سایر هزینه‌های شخصی'
          ]
        }
      }
    };

    const STORAGE_KEY = 'behzad_app_v6_clean_zero';

    const EMPTY_STATE = {
      rates: {
        gold18: 0,
        melted: 0,
        coinFull: 0,
        coinHalf: 0,
        coinQuarter: 0,
        coinGram: 0,
        usd: 0,
        eur: 0,
        try: 0,
        updatedAt: 'ثبت نشده'
      },
      accounts: [],
      transactions: [],
      debts: [],
      tasks: [],
      goals: [],
      customers: []
    };

    const formatNum = (n) => Number(n || 0).toLocaleString('fa-IR');
    const uid = (p = 'id') => `${p}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    const todayJalali = () => {
      try { return new Date().toLocaleDateString('fa-IR'); } catch { return ''; }
    };

    function App() {
      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? { ...EMPTY_STATE, ...JSON.parse(saved) } : EMPTY_STATE;
        } catch {
          return EMPTY_STATE;
        }
      });

      const [activeWs, setActiveWs] = useState('all');
      const [activeTab, setActiveTab] = useState('overview');
      const [showRates, setShowRates] = useState(true);
      const [modal, setModal] = useState(null);
      const [selectedCustomerId, setSelectedCustomerId] = useState(null);
      const [invoiceData, setInvoiceData] = useState(null);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch {}
      }, [data]);

      const ws = WORKSPACES[activeWs] || WORKSPACES.all;

      const filtered = useMemo(() => {
        const byWs = (arr) => activeWs === 'all' ? arr : arr.filter(x => x.workspace === activeWs);
        return {
          accounts: byWs(data.accounts),
          transactions: byWs(data.transactions),
          debts: byWs(data.debts),
          tasks: byWs(data.tasks),
          goals: byWs(data.goals),
          customers: data.customers.filter(c => c.workspace === activeWs)
        };
      }, [data, activeWs]);

      const stats = useMemo(() => {
        const balance = filtered.accounts.reduce((s, a) => s + Number(a.balance || 0), 0);
        const income = filtered.transactions.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount || 0), 0);
        const expense = filtered.transactions.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0);
        const openTasks = filtered.tasks.filter(t => !t.done).length;
        const pendingDebts = filtered.debts.filter(d => d.status === 'pending').length;
        return { balance, income, expense, openTasks, pendingDebts };
      }, [filtered]);

      const handleWorkspaceChange = (id) => {
        setActiveWs(id);
        setSelectedCustomerId(null);
        if (activeTab === 'customers' && id !== 'ghaffari_gold' && id !== 'nuance') {
          setActiveTab('overview');
        }
      };

      const exportJSON = () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dashboard-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
      };

      const importJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            setData({ ...EMPTY_STATE, ...parsed });
            alert('فایل پشتیبان با موفقیت بازیابی شد.');
          } catch {
            alert('فایل نامعتبر است.');
          }
        };
        reader.readAsText(file);
      };

      const resetAllToZero = () => {
        if (confirm('آیا مطمئن هستید که می‌خواهید تمام اطلاعات را پاک کنید و همه‌چیز را صفر کنید؟')) {
          setData(EMPTY_STATE);
          localStorage.removeItem(STORAGE_KEY);
        }
      };

      const openGeneralInvoice = () => {
        setInvoiceData({
          title: `صورت‌حساب و گزارش مالی ${ws.name}`,
          subtitle: ws.subtitle,
          docNo: 'DOC-' + Math.floor(100000 + Math.random() * 900000),
          date: todayJalali(),
          rows: filtered.transactions.map(t => ({
            date: t.date,
            desc: `${t.category}${t.note ? ` (${t.note})` : ''}`,
            meta: t.type === 'income' ? 'درآمد / واریز' : t.type === 'expense' ? 'هزینه / برداشت' : 'انتقال وجه',
            amount: t.amount
          })),
          summary: [
            { label: 'مجموع درآمدها', val: `${formatNum(stats.income)} تومان` },
            { label: 'مجموع هزینه‌ها', val: `${formatNum(stats.expense)} تومان` },
            { label: 'تراز دوره', val: `${formatNum(stats.income - stats.expense)} تومان` },
            { label: 'موجودی کل حساب‌ها', val: `${formatNum(stats.balance)} تومان` }
          ]
        });
      };

      const openCustomerInvoice = (cust) => {
        const deals = cust.deals || [];
        const total = deals.reduce((s, d) => s + Number(d.totalAmount || 0), 0);
        const paid = deals.reduce((s, d) => s + Number(d.paidAmount || 0), 0);
        setInvoiceData({
          title: `فاکتور رسمی معاملات طلا — ${ws.name}`,
          subtitle: `مشتری: ${cust.name} | تلفن: ${cust.phone || '-'} | کد ملی: ${cust.nationalId || '-'}`,
          docNo: 'GLD-' + Math.floor(100000 + Math.random() * 900000),
          date: todayJalali(),
          rows: deals.map(d => ({
            date: d.date,
            desc: `${d.type === 'sell' ? 'فروش' : 'خرید'}: ${d.item} (${d.weight} گرم | عیار ${d.purity} | اجرت ${d.wagePercent}%)`,
            meta: `فی هر گرم: ${formatNum(d.rate)}`,
            amount: d.totalAmount
          })),
          summary: [
            { label: 'جمع کل فاکتور', val: `${formatNum(total)} تومان` },
            { label: 'مبلغ پرداخت‌شده', val: `${formatNum(paid)} تومان` },
            { label: 'مانده حساب مشتری', val: `${formatNum(total - paid)} تومان` }
          ]
        });
      };

      const tabs = [
        { id: 'overview', label: 'خلاصه', icon: 'layout-grid' },
        { id: 'accounting', label: 'حسابداری', icon: 'wallet' },
        { id: 'debts', label: 'اقساط و چک', icon: 'calendar-clock' },
        { id: 'tasks', label: 'کارها', icon: 'check-square' },
        { id: 'goals', label: 'اهداف', icon: 'target' },
        ...(activeWs === 'ghaffari_gold' || activeWs === 'nuance'
          ? [{ id: 'customers', label: 'مشتریان طلا', icon: 'users' }]
          : [])
      ];

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 pb-6">
          {/* هدر جمع‌وجور و کاملاً واکنش‌گرا بدون اسکرول افقی */}
          <header className={`bg-gradient-to-l ${ws.gradient} text-white shadow-lg transition-all duration-300`}>
            <div className="max-w-7xl mx-auto px-3.5 sm:px-6 pt-3.5 pb-3.5">
              {/* ردیف اول: عنوان و دکمه‌های ابزار */}
              <div className="flex items-center justify-between gap-2 mb-3">
                <div className="flex items-center gap-2.5 min-w-0">
                  <div className="w-9 h-9 sm:w-11 sm:h-11 rounded-xl bg-white/10 border border-white/15 flex items-center justify-center shrink-0">
                    <Icon name={ws.icon} className="w-5 h-5 text-amber-300" />
                  </div>
                  <div className="min-w-0">
                    <h1 className="text-base sm:text-xl font-black truncate">{ws.name}</h1>
                    <p className="text-[11px] text-white/70 truncate hidden sm:block">{ws.subtitle}</p>
                  </div>
                </div>

                <div className="flex items-center gap-1.5 shrink-0">
                  <button
                    onClick={openGeneralInvoice}
                    className="flex items-center gap-1 text-[11px] sm:text-xs bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold px-2.5 sm:px-3.5 py-2 rounded-xl transition"
                  >
                    <Icon name="file-text" className="w-3.5 h-3.5" />
                    <span>فاکتور PDF</span>
                  </button>
                  <button
                    onClick={exportJSON}
                    className="p-2 text-xs bg-white/10 hover:bg-white/20 border border-white/15 text-white rounded-xl transition"
                    title="پشتیبان"
                  >
                    <Icon name="download" className="w-3.5 h-3.5" />
                  </button>
                  <label
                    className="cursor-pointer p-2 text-xs bg-white/10 hover:bg-white/20 border border-white/15 text-white rounded-xl transition"
                    title="بازیابی"
                  >
                    <Icon name="upload" className="w-3.5 h-3.5" />
                    <input type="file" accept=".json" onChange={importJSON} className="hidden" />
                  </label>
                  <button
                    onClick={resetAllToZero}
                    className="p-2 text-xs bg-rose-500/20 hover:bg-rose-500/30 border border-rose-400/30 text-rose-200 rounded-xl transition"
                    title="صفر کردن"
                  >
                    <Icon name="rotate-ccw" className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>

              {/* ردیف دوم: شبکه ۳ ستونه در موبایل و ۶ ستونه در دسکتاپ (بدون اسکرول افقی و بریدگی!) */}
              <div className="grid grid-cols-3 sm:grid-cols-6 gap-1.5">
                {Object.values(WORKSPACES).map((item) => {
                  const isActive = activeWs === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => handleWorkspaceChange(item.id)}
                      className={`flex items-center justify-center gap-1.5 px-2 py-2 rounded-xl text-[11px] sm:text-xs font-bold transition-all ${
                        isActive
                          ? item.pillActive
                          : 'bg-white/10 hover:bg-white/20 text-white/85 border border-white/10'
                      }`}
                    >
                      <Icon name={item.icon} className="w-3.5 h-3.5" />
                      <span className="truncate">{item.shortName}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          </header>

          {/* بدنه اصلی */}
          <main className="max-w-7xl w-full mx-auto px-3.5 sm:px-6 pt-4 flex-1">
            
            {/* تابلوی نرخ دستی فقط در بخش طلای غفاری */}
            {activeWs === 'ghaffari_gold' && (
              <div className="bg-gradient-to-l from-amber-50 to-orange-50/70 border border-amber-200 rounded-2xl p-3.5 mb-4 shadow-2xs">
                <div className="flex items-center justify-between gap-2 mb-2.5">
                  <div className="flex items-center gap-2">
                    <div className="w-7 h-7 rounded-lg bg-amber-500/15 text-amber-700 flex items-center justify-center">
                      <Icon name="coins" className="w-4 h-4" />
                    </div>
                    <div>
                      <h3 className="font-bold text-amber-950 text-xs sm:text-sm">نرخ دستی تابلو طلای غفاری</h3>
                      <span className="text-[10px] text-amber-700">به‌روزرسانی: {data.rates.updatedAt}</span>
                    </div>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={() => setModal({ type: 'editRates' })}
                      className="flex items-center gap-1 text-[11px] bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1.5 rounded-lg font-bold"
                    >
                      <Icon name="edit-3" className="w-3 h-3" />
                      <span>تنظیم نرخ‌ها</span>
                    </button>
                    <button
                      onClick={() => setShowRates(!showRates)}
                      className="text-[11px] bg-white border border-amber-300 text-amber-900 px-2 py-1.5 rounded-lg font-medium"
                    >
                      {showRates ? 'بستن' : 'نمایش'}
                    </button>
                  </div>
                </div>

                {showRates && (
                  <div className="grid grid-cols-3 sm:grid-cols-5 gap-1.5 sm:gap-2">
                    {[
                      { label: 'طلای ۱۸ عیار', val: data.rates.gold18, cls: 'text-amber-700' },
                      { label: 'مثقال آبشده', val: data.rates.melted, cls: 'text-amber-800' },
                      { label: 'تمام سکه', val: data.rates.coinFull, cls: 'text-yellow-700' },
                      { label: 'نیم سکه', val: data.rates.coinHalf, cls: 'text-yellow-700' },
                      { label: 'ربع سکه', val: data.rates.coinQuarter, cls: 'text-yellow-700' },
                      { label: 'سکه گرمی', val: data.rates.coinGram, cls: 'text-yellow-700' },
                      { label: 'دلار', val: data.rates.usd, cls: 'text-emerald-700' },
                      { label: 'یورو', val: data.rates.eur, cls: 'text-blue-700' },
                      { label: 'لیر', val: data.rates.try, cls: 'text-rose-700' }
                    ].map((r, i) => (
                      <div
                        key={i}
                        onClick={() => setModal({ type: 'editRates' })}
                        className="cursor-pointer bg-white hover:bg-amber-100/50 border border-amber-200/70 rounded-xl p-2 transition"
                      >
                        <div className="text-[10px] text-slate-500 truncate">{r.label}</div>
                        <div className={`font-extrabold text-xs mt-0.5 truncate ${r.cls}`}>
                          {formatNum(r.val)}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* نوار تب‌های داخلی به‌صورت شبکه ۳ ستونه در موبایل (همه تب‌ها بدون اسکرول افقی دیده می‌شوند) */}
            <div className="grid grid-cols-3 sm:flex sm:flex-wrap gap-1.5 sm:gap-2 pb-3 mb-4 border-b border-slate-200">
              {tabs.map((t) => {
                const active = activeTab === t.id;
                return (
                  <button
                    key={t.id}
                    onClick={() => setActiveTab(t.id)}
                    className={`flex items-center justify-center gap-1.5 px-2.5 py-2 rounded-xl text-[11px] sm:text-xs font-bold transition ${
                      active
                        ? `${ws.accentBg} text-white shadow-xs`
                        : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'
                    }`}
                  >

            {activeTab === 'customers' && (activeWs === 'ghaffari_gold' || activeWs === 'nuance') && (() => {
              const selectedCust = filtered.customers.find(c => c.id === selectedCustomerId) || filtered.customers[0];
              return (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                  <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-2xs">
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="font-bold text-slate-800 text-sm">مشتریان ({filtered.customers.length})</h3>
                      <button
                        onClick={() => setModal({ type: 'addCustomer' })}
                        className={`flex items-center gap-1 text-xs ${ws.accentBg} text-white px-3 py-1.5 rounded-xl font-bold`}
                      >
                        <Icon name="user-plus" className="w-3.5 h-3.5" />
                        <span>مشتری جدید</span>
                      </button>
                    </div>
                    {filtered.customers.length === 0 ? (
                      <p className="text-center text-xs text-slate-400 py-6">هنوز مشتری ثبت نشده است.</p>
                    ) : (
                      <div className="space-y-2">
                        {filtered.customers.map((c) => {
                          const total = (c.deals || []).reduce((s, d) => s + Number(d.totalAmount || 0), 0);
                          const paid = (c.deals || []).reduce((s, d) => s + Number(d.paidAmount || 0), 0);
                          const rem = total - paid;
                          const isSel = selectedCust?.id === c.id;
                          return (
                            <div
                              key={c.id}
                              onClick={() => setSelectedCustomerId(c.id)}
                              className={`cursor-pointer p-3 rounded-xl border transition ${isSel ? 'border-amber-500 bg-amber-50/70' : 'border-slate-200 hover:bg-slate-50'}`}
                            >
                              <div className="flex items-center justify-between">
                                <span className="font-bold text-sm text-slate-900">{c.name}</span>
                                <span className="text-[11px] text-slate-500">{c.phone || ''}</span>
                              </div>
                              <div className="flex items-center justify-between text-[11px] mt-1.5">
                                <span className="text-slate-500">{(c.deals || []).length} معامله</span>
                                <span className={`font-bold ${rem > 0 ? 'text-rose-600' : 'text-emerald-600'}`}>
                                  {rem > 0 ? `مانده: ${formatNum(rem)} ت` : 'تسویه'}
                                </span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>

                  <div className="lg:col-span-2 bg-white border border-slate-200 rounded-2xl p-4 shadow-2xs">
                    {!selectedCust ? (
                      <div className="text-center py-10 text-slate-400">
                        <p className="text-xs">مشتری جدید بسازید یا انتخاب کنید.</p>
                      </div>
                    ) : (
                      <>
                        <div className="flex flex-wrap items-start justify-between gap-2 pb-3 border-b border-slate-200">
                          <div>
                            <h3 className="font-black text-base text-slate-900">{selectedCust.name}</h3>
                            <p className="text-[11px] text-slate-500 mt-0.5">
                              تلفن: {selectedCust.phone || '-'} | کد ملی: {selectedCust.nationalId || '-'}
                            </p>
                          </div>
                          <div className="flex flex-wrap gap-1.5">
                            <button
                              onClick={() => setModal({ type: 'addDeal', customerId: selectedCust.id })}
                              className="text-xs bg-amber-600 text-white px-3 py-1.5 rounded-xl font-bold"
                            >
                              + ثبت معامله
                            </button>
                            <button
                              onClick={() => openCustomerInvoice(selectedCust)}
                              className="text-xs bg-slate-900 text-white px-3 py-1.5 rounded-xl font-bold"
                            >
                              📄 فاکتور PDF
                            </button>
                            <button
                              onClick={() => {
                                if (confirm('مشتری حذف شود؟')) {
                                  setData(d => ({ ...d, customers: d.customers.filter(x => x.id !== selectedCust.id) }));
                                  setSelectedCustomerId(null);
                                }
                              }}
                              className="text-xs bg-rose-50 text-rose-600 px-2.5 py-1.5 rounded-xl"
                            >
                              حذف
                            </button>
                          </div>
                        </div>

                        {(selectedCust.deals || []).length === 0 ? (
                          <p className="text-center text-xs text-slate-400 py-8">هنوز معامله‌ای ثبت نشده است.</p>
                        ) : (
                          <div className="mt-3 overflow-x-auto">
                            <table className="w-full text-right text-xs">
                              <thead>
                                <tr className="border-b border-slate-200 text-slate-500">
                                  <th className="py-2 px-2">تاریخ</th>
                                  <th className="py-2 px-2">کالا</th>
                                  <th className="py-2 px-2">وزن</th>
                                  <th className="py-2 px-2">مبلغ کل</th>
                                  <th className="py-2 px-2">پرداختی</th>
                                </tr>
                              </thead>
                              <tbody>
                                {selectedCust.deals.map((dl) => (
                                  <tr key={dl.id} className="border-b border-slate-100">
                                    <td className="py-2 px-2 text-slate-500">{dl.date}</td>
                                    <td className="py-2 px-2 font-bold">{dl.type === 'sell' ? 'فروش:' : 'خرید:'} {dl.item}</td>
                                    <td className="py-2 px-2">{dl.weight} گ</td>
                                    <td className="py-2 px-2 font-extrabold">{formatNum(dl.totalAmount)}</td>
                                    <td className="py-2 px-2 text-emerald-700 font-bold">{formatNum(dl.paidAmount)}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        )}
                      </>
                    )}
                  </div>
                </div>
              );
            })()}
          </main>

          {modal && (
            <ModalManager
              modal={modal}
              onClose={() => setModal(null)}
              data={data}
              setData={setData}
              activeWs={activeWs}
              ws={ws}
              setSelectedCustomerId={setSelectedCustomerId}
            />
          )}

          {invoiceData && (
            <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl max-w-3xl w-full p-5 shadow-2xl">
                <div className="no-print flex items-center justify-between pb-3 mb-4 border-b">
                  <span className="text-xs font-bold text-slate-600">پیش‌نمایش فاکتور رسمی</span>
                  <div className="flex gap-2">
                    <button onClick={() => window.print()} className="bg-amber-500 text-slate-950 text-xs font-bold px-3.5 py-2 rounded-xl">
                      🖨️ چاپ / ذخیره PDF
                    </button>
                    <button onClick={() => setInvoiceData(null)} className="bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded-xl font-bold">
                      بستن
                    </button>
                  </div>
                </div>

                <div id="printable-invoice" className="border-2 border-slate-800 rounded-xl p-5">
                  <div className="flex items-start justify-between border-b-2 border-slate-800 pb-3 mb-4">
                    <div>
                      <h2 className="text-base font-black text-slate-900">{invoiceData.title}</h2>
                      <p className="text-xs text-slate-600 mt-1">{invoiceData.subtitle}</p>
                    </div>
                    <div className="text-left text-xs space-y-1">
                      <div>شماره: <b>{invoiceData.docNo}</b></div>
                      <div>تاریخ: <b>{invoiceData.date}</b></div>
                    </div>
                  </div>

                  <table className="w-full text-right text-xs border-collapse mb-5">
                    <thead>
                      <tr className="bg-slate-100 border-y border-slate-400">
                        <th className="py-2 px-2">ردیف</th>
                        <th className="py-2 px-2">تاریخ</th>
                        <th className="py-2 px-2">شرح</th>
                        <th className="py-2 px-2">نوع / فی</th>
                        <th className="py-2 px-2">مبلغ (تومان)</th>
                      </tr>
                    </thead>
                    <tbody>
                      {invoiceData.rows.length === 0 ? (
                        <tr><td colSpan="5" className="text-center py-5 text-slate-400">موردی ثبت نشده است.</td></tr>
                      ) : invoiceData.rows.map((r, i) => (
                        <tr key={i} className="border-b border-slate-200">
                          <td className="py-2 px-2">{i + 1}</td>
                          <td className="py-2 px-2">{r.date}</td>
                          <td className="py-2 px-2 font-bold">{r.desc}</td>
                          <td className="py-2 px-2 text-slate-600">{r.meta}</td>
                          <td className="py-2 px-2 font-extrabold">{formatNum(r.amount)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-300 mb-6 text-xs">
                    {invoiceData.summary.map((s, idx) => (
                      <div key={idx}>
                        <div className="text-slate-500">{s.label}</div>
                        <div className="font-black text-slate-900 mt-0.5">{s.val}</div>
                      </div>
                    ))}
                  </div>

                  <div className="flex justify-between text-xs text-slate-500 pt-4 border-t border-dashed border-slate-300">
                    <div>مهر و امضای صادرکننده</div>
                    <div>امضای مشتری</div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ModalManager({ modal, onClose, data, setData, activeWs, ws, setSelectedCustomerId }) {
      const defaultWs = activeWs === 'all' ? 'personal' : activeWs;

      if (modal.type === 'editRates') {
        const handleSave = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          setData(d => ({
            ...d,
            rates: {
              gold18: Number(fd.get('gold18') || 0),
              melted: Number(fd.get('melted') || 0),
              coinFull: Number(fd.get('coinFull') || 0),
              coinHalf: Number(fd.get('coinHalf') || 0),
              coinQuarter: Number(fd.get('coinQuarter') || 0),
              coinGram: Number(fd.get('coinGram') || 0),
              usd: Number(fd.get('usd') || 0),
              eur: Number(fd.get('eur') || 0),
              try: Number(fd.get('try') || 0),
              updatedAt: todayJalali()
            }
          }));
          onClose();
        };
        return (
          <div className="fixed inset-0 bg-slate-950/60 z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl max-w-lg w-full p-5 shadow-2xl">
              <h3 className="font-bold text-base mb-3">تنظیم نرخ دستی تابلو طلای غفاری</h3>
              <form onSubmit={handleSave} className="grid grid-cols-2 gap-2.5 text-xs">
                {[
                  ['gold18', 'طلای ۱۸ عیار (گرم)', data.rates.gold18],
                  ['melted', 'مثقال آبشده', data.rates.melted],
                  ['coinFull', 'تمام سکه', data.rates.coinFull],
                  ['coinHalf', 'نیم سکه', data.rates.coinHalf],
                  ['coinQuarter', 'ربع سکه', data.rates.coinQuarter],
                  ['coinGram', 'سکه یک گرمی', data.rates.coinGram],
                  ['usd', 'دلار آمریکا', data.rates.usd],
                  ['eur', 'یورو اروپا', data.rates.eur],
                  ['try', 'لیر ترکیه', data.rates.try]
                ].map(([name, label, val]) => (
                  <div key={name}>
                    <label className="block text-slate-500 mb-1">{label}</label>
                    <input name={name} type="number" defaultValue={val} className="w-full border border-slate-300 rounded-xl p-2" />
                  </div>
                ))}
                <div className="col-span-2 flex justify-end gap-2 mt-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border">انصراف</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-amber-600 text-white font-bold">ذخیره نرخ‌ها</button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      if (modal.type === 'addAccount') {
        const handleSave = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          setData(d => ({
            ...d,
            accounts: [...d.accounts, {
              id: uid('acc'),
              workspace: fd.get('workspace'),
              name: fd.get('name'),
              bank: fd.get('bank'),
              balance: Number(fd.get('balance') || 0)
            }]
          }));
          onClose();
        };
        return (
          <div className="fixed inset-0 bg-slate-950/60 z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl">
              <h3 className="font-bold text-base mb-3">افزودن حساب بانکی یا صندوق</h3>
              <form onSubmit={handleSave} className="space-y-3 text-xs">
                <div>
                  <label className="block text-slate-500 mb-1">بخش مربوطه</label>
                  <select name="workspace" defaultValue={defaultWs} className="w-full border border-slate-300 rounded-xl p-2.5">
                    {['hideaway', 'ghaffari_gold', 'nuance', 'home', 'personal'].map(id => (
                      <option key={id} value={id}>{WORKSPACES[id].name}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-slate-500 mb-1">نام حساب / صندوق</label>
                  <input name="name" required className="w-full border border-slate-300 rounded-xl p-2.5" placeholder="مثلاً: کارت POS کافه یا حساب شخصی" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-slate-500 mb-1">نام بانک</label>
                    <input name="bank" className="w-full border border-slate-300 rounded-xl p-2.5" placeholder="ملت / سامان / نقد" />
                  </div>
                  <div>
                    <label className="block text-slate-500 mb-1">موجودی اولیه (تومان)</label>
                    <input name="balance" type="number" defaultValue={0} className="w-full border border-slate-300 rounded-xl p-2.5" />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border">انصراف</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-slate-900 text-white font-bold">ذخیره حساب</button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      if (modal.type === 'addTransaction') {
        const [selWs, setSelWs] = useState(defaultWs);
        const [txType, setTxType] = useState('expense');
        const currentCats = WORKSPACES[selWs]?.categories[txType] || [];

        const handleSave = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const amount = Number(fd.get('amount') || 0);
          const accountId = fd.get('accountId');
          setData(d => ({
            ...d,
            transactions: [{
              id: uid('tx'),
              workspace: selWs,
              type: txType,
              category: fd.get('category'),
              amount,
              accountId,
              date: fd.get('date'),
              note: fd.get('note')
            }, ...d.transactions],
            accounts: d.accounts.map(a => a.id === accountId ? {
              ...a,
              balance: Number(a.balance || 0) + (txType === 'income' ? amount : -amount)
            } : a)
          }));
          onClose();
        };

        return (
          <div className="fixed inset-0 bg-slate-950/60 z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl">
              <h3 className="font-bold text-base mb-3">ثبت درآمد یا هزینه جدید</h3>
              <form onSubmit={handleSave} className="space-y-3 text-xs">
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-slate-500 mb-1">بخش</label>
                    <select value={selWs} onChange={e => setSelWs(e.target.value)} className="w-full border border-slate-300 rounded-xl p-2.5">
                      {['hideaway', 'ghaffari_gold', 'nuance', 'home', 'personal'].map(id => (
                        <option key={id} value={id}>{WORKSPACES[id].name}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-500 mb-1">نوع</label>
                    <select value={txType} onChange={e => setTxType(e.target.value)} className="w-full border border-slate-300 rounded-xl p-2.5">
                      <option value="expense">هزینه (-)</option>
                      <option value="income">درآمد (+)</option>
                    </select>
                  </div>
                </div>
                <div>
                  <label className="block text-slate-500 mb-1">دسته‌بندی</label>
                  <select name="category" className="w-full border border-slate-300 rounded-xl p-2.5">
                    {currentCats.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-slate-500 mb-1">مبلغ (تومان)</label>
                    <input name="amount" type="number" required className="w-full border border-slate-300 rounded-xl p-2.5" />
                  </div>
                  <div>
                    <label className="block text-slate-500 mb-1">حساب / صندوق</label>
                    <select name="accountId" className="w-full border border-slate-300 rounded-xl p-2.5">
                      <option value="">بدون اتصال به حساب</option>
                      {data.accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                    </select>
                  </div>
                </div>
                <div>
                  <label className="block text-slate-500 mb-1">تاریخ</label>
                  <input name="date" defaultValue={todayJalali()} className="w-full border border-slate-300 rounded-xl p-2.5" />
                </div>
                <div>
                  <label className="block text-slate-500 mb-1">توضیحات</label>
                  <input name="note" className="w-full border border-slate-300 rounded-xl p-2.5" />
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border">انصراف</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-slate-900 text-white font-bold">ثبت تراکنش</button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      if (modal.type === 'addDebt') {
        const handleSave = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          setData(d => ({
            ...d,
            debts: [{
              id: uid('dbt'),
              workspace: fd.get('workspace'),
              kind: fd.get('kind'),
              title: fd.get('title'),
              person: fd.get('person'),
              amount: Number(fd.get('amount') || 0),
              dueDate: fd.get('dueDate'),
              status: 'pending'
            }, ...d.debts]
          }));
          onClose();
        };
        return (
          <div className="fixed inset-0 bg-slate-950/60 z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl">
              <h3 className="font-bold text-base mb-3">ثبت قسط، چک، بدهی یا طلب</h3>
              <form onSubmit={handleSave} className="space-y-3 text-xs">
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-slate-500 mb-1">بخش</label>
                    <select name="workspace" defaultValue={defaultWs} className="w-full border rounded-xl p-2.5">
                      {['hideaway', 'ghaffari_gold', 'nuance', 'home', 'personal'].map(id => <option key={id} value={id}>{WORKSPACES[id].name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-500 mb-1">نوع</label>
                    <select name="kind" className="w-full border rounded-xl p-2.5">
                      <option value="installment">قسط</option>
                      <option value="check">چک</option>
                      <option value="debt">بدهی</option>
                      <option value="receivable">طلب</option>
                    </select>
                  </div>
                </div>
                <div><label className="block text-slate-500 mb-1">عنوان</label><input name="title" required className="w-full border rounded-xl p-2.5" /></div>
                <div className="grid grid-cols-2 gap-2">
                  <div><label className="block text-slate-500 mb-1">طرف حساب</label><input name="person" className="w-full border rounded-xl p-2.5" /></div>
                  <div><label className="block text-slate-500 mb-1">مبلغ (تومان)</label><input name="amount" type="number" required className="w-full border rounded-xl p-2.5" /></div>
                </div>
                <div><label className="block text-slate-500 mb-1">تاریخ سررسید</label><input name="dueDate" defaultValue={todayJalali()} className="w-full border rounded-xl p-2.5" /></div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border">انصراف</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-slate-900 text-white font-bold">ثبت</button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      if (modal.type === 'addTask') {
        const handleSave = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          setData(d => ({
            ...d,
            tasks: [{
              id: uid('tsk'),
              workspace: fd.get('workspace'),
              title: fd.get('title'),
              priority: fd.get('priority'),
              dueDate: fd.get('dueDate'),
              done: false
            }, ...d.tasks]
          }));
          onClose();
        };
        return (
          <div className="fixed inset-0 bg-slate-950/60 z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl">
              <h3 className="font-bold text-base mb-3">افزودن کار جدید</h3>
              <form onSubmit={handleSave} className="space-y-3 text-xs">
                <div>
                  <label className="block text-slate-500 mb-1">بخش</label>
                  <select name="workspace" defaultValue={defaultWs} className="w-full border rounded-xl p-2.5">
                    {['hideaway', 'ghaffari_gold', 'nuance', 'home', 'personal'].map(id => <option key={id} value={id}>{WORKSPACES[id].name}</option>)}
                  </select>
                </div>
                <div><label className="block text-slate-500 mb-1">عنوان کار</label><input name="title" required className="w-full border rounded-xl p-2.5" /></div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-slate-500 mb-1">اولویت</label>
                    <select name="priority" className="w-full border rounded-xl p-2.5">
                      <option value="urgent">فوری</option>
                      <option value="important">مهم</option>
                      <option value="normal">عادی</option>
                    </select>
                  </div>
                  <div><label className="block text-slate-500 mb-1">تاریخ انجام</label><input name="dueDate" defaultValue={todayJalali()} className="w-full border rounded-xl p-2.5" /></div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border">انصراف</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-slate-900 text-white font-bold">ذخیره کار</button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      if (modal.type === 'addGoal') {
        const handleSave = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          setData(d => ({
            ...d,
            goals: [{
              id: uid('gl'),
              workspace: fd.get('workspace'),
              title: fd.get('title'),
              target: Number(fd.get('target') || 0),
              current: Number(fd.get('current') || 0),
              unit: fd.get('unit') || 'تومان',
              deadline: fd.get('deadline')
            }, ...d.goals]
          }));
          onClose();
        };
        return (
          <div className="fixed inset-0 bg-slate-950/60 z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl">
              <h3 className="font-bold text-base mb-3">تعریف هدف زمان‌بندی‌شده</h3>
              <form onSubmit={handleSave} className="space-y-3 text-xs">
                <div>
                  <label className="block text-slate-500 mb-1">بخش</label>
                  <select name="workspace" defaultValue={defaultWs} className="w-full border rounded-xl p-2.5">
                    {['hideaway', 'ghaffari_gold', 'nuance', 'home', 'personal'].map(id => <option key={id} value={id}>{WORKSPACES[id].name}</option>)}
                  </select>
                </div>
                <div><label className="block text-slate-500 mb-1">عنوان هدف</label><input name="title" required className="w-full border rounded-xl p-2.5" /></div>
                <div className="grid grid-cols-3 gap-2">
                  <div><label className="block text-slate-500 mb-1">مقدار هدف</label><input name="target" type="number" required className="w-full border rounded-xl p-2.5" /></div>
                  <div><label className="block text-slate-500 mb-1">فعلی</label><input name="current" type="number" defaultValue={0} className="w-full border rounded-xl p-2.5" /></div>
                  <div><label className="block text-slate-500 mb-1">واحد</label><input name="unit" defaultValue="تومان" className="w-full border rounded-xl p-2.5" /></div>
                </div>
                <div><label className="block text-slate-500 mb-1">مهلت زمانی</label><input name="deadline" defaultValue="1405/12/29" className="w-full border rounded-xl p-2.5" /></div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border">انصراف</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-amber-600 text-white font-bold">ثبت هدف</button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      if (modal.type === 'progressGoal') {
        const handleSave = (e) => {
          e.preventDefault();
          const delta = Number(new FormData(e.target).get('delta') || 0);
          setData(d => ({
            ...d,
            goals: d.goals.map(g => g.id === modal.goalId ? { ...g, current: Number(g.current || 0) + delta } : g)
          }));
          onClose();
        };
        return (
          <div className="fixed inset-0 bg-slate-950/60 z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl">
              <h3 className="font-bold text-sm mb-3">افزودن پیشرفت جدید</h3>
              <form onSubmit={handleSave} className="space-y-3 text-xs">
                <input name="delta" type="number" required placeholder="مقدار پیشرفت جدید..." className="w-full border rounded-xl p-2.5" />
                <div className="flex justify-end gap-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border">انصراف</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold">ثبت</button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      if (modal.type === 'addCustomer') {
        const handleSave = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const id = uid('cust');
          setData(d => ({
            ...d,
            customers: [{
              id,
              workspace: activeWs,
              name: fd.get('name'),
              phone: fd.get('phone'),
              nationalId: fd.get('nationalId'),
              address: fd.get('address'),
              deals: []
            }, ...d.customers]
          }));
          setSelectedCustomerId(id);
          onClose();
        };
        return (
          <div className="fixed inset-0 bg-slate-950/60 z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl">
              <h3 className="font-bold text-base mb-3">ثبت مشتری جدید ({ws.name})</h3>
              <form onSubmit={handleSave} className="space-y-3 text-xs">
                <div><label className="block text-slate-500 mb-1">نام و نام خانوادگی</label><input name="name" required className="w-full border rounded-xl p-2.5" /></div>
                <div className="grid grid-cols-2 gap-2">
                  <div><label className="block text-slate-500 mb-1">تلفن</label><input name="phone" className="w-full border rounded-xl p-2.5" /></div>
                  <div><label className="block text-slate-500 mb-1">کد ملی</label><input name="nationalId" className="w-full border rounded-xl p-2.5" /></div>
                </div>
                <div><label className="block text-slate-500 mb-1">آدرس</label><input name="address" className="w-full border rounded-xl p-2.5" /></div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border">انصراف</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-slate-900 text-white font-bold">ذخیره مشتری</button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      if (modal.type === 'addDeal') {
        const handleSave = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const weight = Number(fd.get('weight') || 0);
          const rate = Number(fd.get('rate') || 0);
          const wagePercent = Number(fd.get('wagePercent') || 0);
          const raw = weight * rate;
          const totalAmount = Math.round(raw + (raw * (wagePercent / 100)));

          setData(d => ({
            ...d,
            customers: d.customers.map(c => c.id === modal.customerId ? {
              ...c,
              deals: [{
                id: uid('dl'),
                date: fd.get('date'),
                type: fd.get('type'),
                item: fd.get('item'),
                weight,
                purity: fd.get('purity'),
                rate,
                wagePercent,
                totalAmount,
                paidAmount: Number(fd.get('paidAmount') || 0),
                note: fd.get('note')
              }, ...(c.deals || [])]
            } : c)
          }));
          onClose();
        };
        return (
          <div className="fixed inset-0 bg-slate-950/60 z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl">
              <h3 className="font-bold text-base mb-3">ثبت معامله طلا</h3>
              <form onSubmit={handleSave} className="space-y-3 text-xs">
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-slate-500 mb-1">نوع معامله</label>
                    <select name="type" className="w-full border rounded-xl p-2.5">
                      <option value="sell">فروش به مشتری</option>
                      <option value="buy">خرید از مشتری</option>
                    </select>
                  </div>
                  <div><label className="block text-slate-500 mb-1">تاریخ</label><input name="date" defaultValue={todayJalali()} className="w-full border rounded-xl p-2.5" /></div>
                </div>
                <div><label className="block text-slate-500 mb-1">شرح قطعه طلا</label><input name="item" required className="w-full border rounded-xl p-2.5" /></div>
                <div className="grid grid-cols-3 gap-2">
                  <div><label className="block text-slate-500 mb-1">وزن (گرم)</label><input name="weight" type="number" step="0.01" required className="w-full border rounded-xl p-2.5" /></div>
                  <div><label className="block text-slate-500 mb-1">عیار</label><input name="purity" defaultValue="750" className="w-full border rounded-xl p-2.5" /></div>
                  <div><label className="block text-slate-500 mb-1">اجرت (%)</label><input name="wagePercent" type="number" defaultValue="10" className="w-full border rounded-xl p-2.5" /></div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div><label className="block text-slate-500 mb-1">نرخ هر گرم (تومان)</label><input name="rate" type="number" defaultValue={data.rates.gold18 || 0} required className="w-full border rounded-xl p-2.5" /></div>
                  <div><label className="block text-slate-500 mb-1">مبلغ پرداختی (تومان)</label><input name="paidAmount" type="number" required className="w-full border rounded-xl p-2.5" /></div>
                </div>
                <div><label className="block text-slate-500 mb-1">توضیحات</label><input name="note" className="w-full border rounded-xl p-2.5" /></div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border">انصراف</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-amber-600 text-white font-bold">ثبت معامله</button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
