          nationalId: '',

          deals: [
            { id: 'dl2', date: '1405/08/22', type: 'sell', item: 'انگشتر مینیمال Nuance', weight: 3.2, purity: '750', rate: 4650000, wagePercent: 15, totalAmount: 17112000, paidAmount: 17112000, note: 'ارسال با پست پیشتاز و بسته‌بندی ویژه' }
          ]
        }
      ]
    };

    let state = loadState();
    let modal = null; // { type, data }
    let selectedCustomerId = null;
    let invoiceModalData = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        return { ...JSON.parse(JSON.stringify(DEFAULT_STATE)), ...JSON.parse(raw) };
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      render();
    }

    function formatNum(n) {
      return Number(n || 0).toLocaleString('fa-IR');
    }

    function uid(prefix = 'id') {
      return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    }

    function todayJalali() {
      try {
        return new Date().toLocaleDateString('fa-IR');
      } catch {
        return '1405/08/23';
      }
    }

    function filterByWorkspace(list) {
      if (state.activeWorkspace === 'all') return list;
      return list.filter(x => x.workspace === state.activeWorkspace);
    }

    function getWorkspaceInfo(wsId) {
      return WORKSPACES[wsId] || WORKSPACES.all;
    }

    // ==========================================
    // عملیات‌ها (Actions)
    // ==========================================
    function setWorkspace(ws) {
      state.activeWorkspace = ws;
      if (state.activeTab === 'customers' && ws !== 'ghaffari_gold' && ws !== 'nuance') {
        state.activeTab = 'overview';
      }
      selectedCustomerId = null;
      saveState();
    }

    function setTab(tab) {
      state.activeTab = tab;
      selectedCustomerId = null;
      saveState();
    }

    function openModal(type, data = null) {
      modal = { type, data };
      render();
    }

    function closeModal() {
      modal = null;
      render();
    }

    // خروجی پشتیبان JSON و بازیابی
    function exportBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `dashboard-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && parsed.accounts) {
            state = parsed;
            saveState();
            alert('فایل پشتیبان با موفقیت بازیابی شد!');
          }
        } catch {
          alert('فایل انتخاب‌شده معتبر نیست.');
        }
      };
      reader.readAsText(file);
    }

    // باز کردن پیش‌نمایش فاکتور PDF
    function openWorkspaceInvoice() {
      const ws = getWorkspaceInfo(state.activeWorkspace);
      const txs = filterByWorkspace(state.transactions);
      const accs = filterByWorkspace(state.accounts);
      const totalIncome = txs.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
      const totalExpense = txs.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
      const totalBalance = accs.reduce((s, a) => s + Number(a.balance), 0);

      invoiceModalData = {
        title: `صورت‌حساب و گزارش مالی ${ws.name}`,
        subtitle: ws.subtitle,
        docNumber: 'INV-' + Math.floor(100000 + Math.random() * 900000),
        date: todayJalali(),
        customerName: null,
        rows: txs.map(t => ({
          date: t.date,
          desc: `${t.category}${t.note ? ' - ' + t.note : ''}`,
          type: t.type === 'income' ? 'درآمد / واریز' : t.type === 'expense' ? 'هزینه / برداشت' : 'انتقال وجه',
          amount: t.amount
        })),
        summary: [
          { label: 'جمع درآمدها', value: formatNum(totalIncome) + ' تومان' },
          { label: 'جمع هزینه‌ها', value: formatNum(totalExpense) + ' تومان' },
          { label: 'تراز دوره', value: formatNum(totalIncome - totalExpense) + ' تومان' },
          { label: 'موجودی کل حساب‌ها', value: formatNum(totalBalance) + ' تومان' }
        ]
      };
      render();
    }

    function openCustomerInvoice(customer) {
      const ws = getWorkspaceInfo(customer.workspace);
      const deals = customer.deals || [];
      let totalBuy = 0;
      let totalPaid = 0;
      deals.forEach(d => {
        totalBuy += Number(d.totalAmount || 0);
        totalPaid += Number(d.paidAmount || 0);
      });

      invoiceModalData = {
        title: `فاکتور رسمی معاملات طلا - ${ws.name}`,
        subtitle: `مشتری: ${customer.name} | تلفن: ${customer.phone || '-'}`,
        docNumber: 'GLD-' + Math.floor(100000 + Math.random() * 900000),
        date: todayJalali(),
        customer: customer,
        rows: deals.map(d => ({
          date: d.date,
          desc: `${d.type === 'sell' ? 'فروش' : 'خرید'}: ${d.item} (${d.weight} گرم | عیار ${d.purity} | اجرت ${d.wagePercent}%)`,
          type: `فی: ${formatNum(d.rate)}`,
          amount: d.totalAmount
        })),
        summary: [
          { label: 'جمع کل فاکتور', value: formatNum(totalBuy) + ' تومان' },
          { label: 'مبلغ پرداخت‌شده', value: formatNum(totalPaid) + ' تومان' },
          { label: 'مانده حساب مشتری', value: formatNum(totalBuy - totalPaid) + ' تومان' }
        ]
      };
      render();
    }

    // ==========================================

      if (state.activeWorkspace !== 'ghaffari_gold') return '';

          <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">

              <h3 class="font-bold text-amber-950 text-sm">نرخ دستی تابلو طلای غفاری</h3>
              <span class="text-xs text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full">آخرین ثبت: ${r.updatedAt}</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="openModal('editRates')" class="text-xs bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg font-medium transition">
                ✏️ ویرایش نرخ‌ها
              </button>
              <button onclick="state.showRatesBar = !state.showRatesBar; saveState();" class="text-xs bg-white border border-amber-300 text-amber-900 px-2.5 py-1.5 rounded-lg">
                ${state.showRatesBar ? 'بستن' : 'نمایش'}
              </button>
            </div>
          </div>
          ${state.showRatesBar ? `
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
              ${items.map(it => `
                <div onclick="openModal('editRates')" class="cursor-pointer bg-white hover:bg-amber-100/60 border border-amber-200/80 rounded-xl px-3 py-2 flex flex-col justify-between transition">
                  <span class="text-[11px] text-slate-500">${it.label}</span>
                  <span class="font-bold text-sm ${it.color} mt-0.5">${formatNum(it.val)} <span class="text-[10px] font-normal text-slate-400">تومان</span></span>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderOverview(ws) {
      const accs = filterByWorkspace(state.accounts);
      const txs = filterByWorkspace(state.transactions);
      const debts = filterByWorkspace(state.debts).filter(d => d.status === 'pending');
      const tasks = filterByWorkspace(state.tasks).filter(t => !t.done);

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">

    function submitRates(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.rates = {
        gold18: Number(fd.get('gold18')),
        melted: Number(fd.get('melted')),
        coinFull: Number(fd.get('coinFull')),
        coinHalf: Number(fd.get('coinHalf')),
        coinQuarter: Number(fd.get('coinQuarter')),
        coinGram: Number(fd.get('coinGram')),
        usd: Number(fd.get('usd')),
        eur: Number(fd.get('eur')),
        try: Number(fd.get('try')),
        updatedAt: todayJalali()
      };
      closeModal();
      saveState();
    }

    function submitTransaction(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const amount = Number(fd.get('amount'));
      const type = fd.get('type');
      const accountId = fd.get('accountId');

      state.transactions.unshift({
        id: uid('tx'),
        workspace: fd.get('workspace'),
        type,
        category: fd.get('category'),
        amount,
        accountId,
        date: fd.get('date'),
        note: fd.get('note')
      });

      const acc = state.accounts.find(a => a.id === accountId);
      if (acc) {
        acc.balance = Number(acc.balance) + (type === 'income' ? amount : -amount);
      }
      closeModal();
      saveState();
    }

    function submitAccount(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.accounts.push({
        id: uid('acc'),
        workspace: fd.get('workspace'),
        name: fd.get('name'),
        bank: fd.get('bank'),
        balance: Number(fd.get('balance'))
      });
      closeModal();
      saveState();
    }

    function submitDebt(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.debts.unshift({
        id: uid('dbt'),
        workspace: fd.get('workspace'),
        kind: fd.get('kind'),
        title: fd.get('title'),
        person: fd.get('person'),
        amount: Number(fd.get('amount')),
        dueDate: fd.get('dueDate'),
        status: 'pending'
      });
      closeModal();
      saveState();
    }

    function settleDebt(id) {
      const d = state.debts.find(x => x.id === id);
      if (d) d.status = 'paid';
      saveState();
    }

    function submitTask(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.tasks.unshift({
        id: uid('tsk'),
        workspace: fd.get('workspace'),
        title: fd.get('title'),
        priority: fd.get('priority'),
        dueDate: fd.get('dueDate'),
        done: false
      });
      closeModal();
      saveState();
    }

    function toggleTask(id) {
      const tk = state.tasks.find(x => x.id === id);
      if (tk) tk.done = !tk.done;
      saveState();
    }

    function submitGoal(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.goals.unshift({
        id: uid('gl'),
        workspace: fd.get('workspace'),
        title: fd.get('title'),
        target: Number(fd.get('target')),
        current: Number(fd.get('current')),
        unit: fd.get('unit'),
        deadline: fd.get('deadline')
      });
      closeModal();
      saveState();
    }

    function submitGoalProgress(e, id) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const g = state.goals.find(x => x.id === id);
      if (g) g.current = Number(g.current) + Number(fd.get('delta'));
      closeModal();
      saveState();
    }

    function submitCustomer(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const newCust = {
        id: uid('cust'),
        workspace: state.activeWorkspace,
        name: fd.get('name'),
        phone: fd.get('phone'),
        nationalId: fd.get('nationalId'),
        address: fd.get('address'),
        deals: []
      };
      state.customers.unshift(newCust);
      selectedCustomerId = newCust.id;
      closeModal();
      saveState();
    }

    function deleteCustomer(id) {
      if (!confirm('آیا از حذف این مشتری و معاملاتش مطمئن هستید؟')) return;
      state.customers = state.customers.filter(c => c.id !== id);
      selectedCustomerId = null;
      saveState();
    }

    function submitDeal(e, custId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const weight = Number(fd.get('weight'));
      const rate = Number(fd.get('rate'));
      const wagePercent = Number(fd.get('wagePercent'));
      const rawGold = weight * rate;
      const totalAmount = Math.round(rawGold + (rawGold * (wagePercent / 100)));

      const cust = state.customers.find(c => c.id === custId);
      if (cust) {
        cust.deals = cust.deals || [];
        cust.deals.unshift({
          id: uid('dl'),
          date: fd.get('date'),
          type: fd.get('type'),
          item: fd.get('item'),
          weight,
          purity: fd.get('purity'),
          rate,
          wagePercent,
          totalAmount,
          paidAmount: Number(fd.get('paidAmount')),
          note: fd.get('note')
        });
      }
      closeModal();
      saveState();
    }

    function deleteItem(collection, id) {
      if (!confirm('حذف شود؟')) return;
      state[collection] = state[collection].filter(x => x.id !== id);
      saveState();
    }

    // ==========================================
    // رندر اصلی صفحه
    // ==========================================
    function render() {
      const ws = getWorkspaceInfo(state.activeWorkspace);
      const showCustomersTab = state.activeWorkspace === 'ghaffari_gold' || state.activeWorkspace === 'nuance';

      const tabs = [
        { id: 'overview', label: '📊 داشبورد و خلاصه' },
        { id: 'accounting', label: '💰 حسابداری و صندوق‌ها' },
        { id: 'debts', label: '📅 اقساط، چک و بدهی' },
        { id: 'tasks', label: '✅ مدیریت کارها' },
        { id: 'goals', label: '🎯 اهداف زمان‌بندی‌شده' }
      ];
      if (showCustomersTab) {
        tabs.push({ id: 'customers', label: '💎 مشتریان و معاملات طلا' });
      }

      let contentHtml = '';
      if (state.activeTab === 'overview') contentHtml = renderOverview(ws);
      else if (state.activeTab === 'accounting') contentHtml = renderAccounting();
      else if (state.activeTab === 'debts') contentHtml = renderDebts();
      else if (state.activeTab === 'tasks') contentHtml = renderTasks();
      else if (state.activeTab === 'goals') contentHtml = renderGoals();
      else if (state.activeTab === 'customers') contentHtml = renderCustomers();

      document.getElementById('app').innerHTML = `
        <div class="min-h-screen flex flex-col">
          <!-- نوار انتخاب فضاهای کاری -->
          <header class="${ws.headerBg} text-white shadow-lg transition-colors">
            <div class="max-w-7xl mx-auto px-4 pt-4 pb-3">
              <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div>
                  <h1 class="text-lg sm:text-xl font-extrabold tracking-tight flex items-center gap-2">
                    <span>${ws.name}</span>
                  </h1>
                  <p class="text-xs text-white/75 mt-0.5">${ws.subtitle}</p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                  <button onclick="openWorkspaceInvoice()" class="text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3.5 py-2 rounded-xl shadow-xs transition">
                    📄 خروجی PDF / فاکتور
                  </button>
                  <button onclick="exportBackup()" class="text-xs bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl" title="دانلود فایل پشتیبان">
                    💾 پشتیبان
                  </button>
                  <label class="cursor-pointer text-xs bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl" title="بازیابی فایل پشتیبان">
                    📂 بازیابی
                    <input type="file" accept=".json" onchange="importBackup(event)" class="hidden" />
                  </label>
                </div>
              </div>

              <!-- دکمه‌های جابه‌جایی بین بخش‌ها -->
              <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
                ${Object.values(WORKSPACES).map(w => `
                  <button onclick="setWorkspace('${w.id}')" class="whitespace-nowrap px-3.5 py-2 rounded-xl text-xs font-bold transition ${state.activeWorkspace === w.id ? 'bg-white text-slate-950 shadow-sm' : 'bg-white/10 text-white/85 hover:bg-white/20'}">
                    ${w.name}
                  </button>
                `).join('')}
              </div>
            </div>
          </header>

          <!-- محتوای اصلی -->
          <main class="max-w-7xl w-full mx-auto px-4 py-5 flex-1">
            ${renderRatesBar()}

            <!-- تب‌های داخلی -->
            <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-5 border-b border-slate-200">
              ${tabs.map(t => `
                <button onclick="setTab('${t.id}')" class="whitespace-nowrap px-4 py-2 rounded-xl text-xs font-bold transition ${state.activeTab === t.id ? 'bg-slate-900 text-white shadow-xs' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                  ${t.label}
                </button>
              `).join('')}
            </div>

            ${contentHtml}
          </main>
        </div>
        ${renderModal()}
        ${renderInvoiceModal()}
      `;
    }

    render();
  </script>
</body>
</html>
