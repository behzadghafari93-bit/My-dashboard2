<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090d16" />
  <title>داشبورد مدیریت یکپارچه | Hideaway • Nuance • طلای غفاری</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * { font-family: 'Vazirmatn', sans-serif !important; }
    body { margin: 0; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @media print {
      body * { visibility: hidden; }
      #printable-invoice, #printable-invoice * { visibility: visible; }
      #printable-invoice {
        position: fixed;
        inset: 0;
        width: 100%;
        background: white !important;
        color: black !important;
        padding: 24px !important;
        z-index: 999999;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const ref = React.useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const iconEl = document.createElement('i');
          iconEl.setAttribute('data-lucide', name);
          iconEl.className = className;
          ref.current.appendChild(iconEl);
          window.lucide.createIcons({ nodes: [iconEl] });
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0"></span>;
    };

    const WORKSPACES = {
      all: {
        id: 'all',
        name: 'نمای تجمیعی کل',
        tag: 'نمای کلی کل',
        subtitle: 'گزارش یکپارچه تمام کسب‌وکارها و زندگی شخصی',
        icon: 'layers',
        pillActive: 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/40',
        bannerGradient: 'from-emerald-600 via-teal-600 to-emerald-800',
        badge: 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30',
        categories: {
          income: ['فروش کافه', 'فروش طلا', 'فروش آنلاین‌شاپ', 'سایر درآمدها'],
          expense: ['خرید مواد اولیه', 'خرید طلا و سکه', 'هزینه جاری', 'قبوض', 'سایر هزینه‌ها']
        }
      },
      hideaway: {
        id: 'hideaway',
        name: 'Hideaway',
        tag: 'کافه Hideaway',
        subtitle: 'مدیریت مالی، بار، ایونت‌ها و کارهای کافه Hideaway',
        icon: 'coffee',
        pillActive: 'bg-[#2f4456] text-[#f3e5ab] border border-[#d4af37]/50 shadow-lg',
        bannerGradient: 'from-[#2f4456] via-[#233544] to-[#17232e]',
        badge: 'bg-[#2f4456]/60 text-[#f3e5ab] border border-[#d4af37]/30',
        categories: {
          income: ['فروش POS کافه', 'فروش نقدی', 'درآمد ورکشاپ و ایونت', 'سفارش بیرون‌بر', 'سایر درآمدهای Hideaway'],
          expense: ['خرید دانه قهوه و بار سرد/گرم', 'خرید کیک و شیرینی', 'حقوق باریستا و پرسنل', 'اجاره و شارژ کافه', 'تبلیغات و تولید محتوا', 'تجهیزات و تعمیرات']
        }
      },
      nuance: {
        id: 'nuance',
        name: 'Nuance',
        tag: 'آنلاین‌شاپ Nuance',
        subtitle: 'مدیریت فروش آنلاین، بسته‌بندی و مشتریان Nuance',
        icon: 'gem',
        pillActive: 'bg-[#6b0f2b] text-[#f8d778] border border-[#e2b857]/50 shadow-lg',
        bannerGradient: 'from-[#6b0f2b] via-[#4c0519] to-[#2e030f]',
        badge: 'bg-[#4c0519]/70 text-[#f8d778] border border-[#e2b857]/30',
        categories: {
          income: ['فروش آنلاین سایت / اینستاگرام', 'سفارش اختصاصی مشتری', 'تسویه درگاه پرداخت', 'سایر درآمدهای Nuance'],
          expense: ['تأمین طلا و متریال', 'چاپ و بسته‌بندی لوکس (زرشکی/طلاکوب)', 'تبلیغات و عکاسی', 'ارسال پستی و پیک بیمه', 'کارمزد درگاه و مالیات']
        }
      },
      ghaffari_gold: {
        id: 'ghaffari_gold',
        name: 'طلای غفاری',
        tag: 'مغازه طلای غفاری',
        subtitle: 'حسابداری مغازه طلای غفاری، نرخ تابلو و دفتر مشتریان',
        icon: 'coins',
        pillActive: 'bg-amber-600 text-white shadow-lg shadow-amber-900/40',
        bannerGradient: 'from-amber-600 via-amber-700 to-stone-900',
        badge: 'bg-amber-500/20 text-amber-300 border border-amber-500/30',
        categories: {
          income: ['فروش طلای زینتی', 'فروش سکه و آبشده', 'دریافت اجرت و سود', 'سایر درآمدهای مغازه'],
          expense: ['خرید طلای آبشده / بنکداری', 'خرید سکه', 'اجرت ساخت کارگاه', 'حقوق و کمیسیون', 'امنیت، بیمه و اجاره مغازه']
        }
      },
      home: {
        id: 'home',
        name: 'کارهای خانه',
        tag: 'مدیریت منزل',
        subtitle: 'مدیریت مخارج منزل، خریدهای خانه و کارهای روزمره',
        icon: 'home',
        pillActive: 'bg-teal-600 text-white shadow-lg',
        bannerGradient: 'from-teal-600 via-emerald-700 to-slate-900',
        badge: 'bg-teal-500/20 text-teal-300 border border-teal-500/30',
        categories: {
          income: ['بودجه واریزی منزل', 'سایر واریزی‌های خانه'],
          expense: ['خرید سوپرمارکت و میوه', 'پروتئین و مواد غذایی', 'لوازم و تعمیرات منزل', 'شارژ ساختمان و نظافت', 'خرید برای منزل']
        }
      },
      personal: {
        id: 'personal',
        name: 'کارهای شخصی',
        tag: 'امور شخصی',
        subtitle: 'حسابداری شخصی، قبوض، اقساط، اهداف و برنامه‌ریزی فردی',
        icon: 'user',
        pillActive: 'bg-indigo-600 text-white shadow-lg',
        bannerGradient: 'from-indigo-600 via-indigo-800 to-slate-900',
        badge: 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30',
        categories: {
          income: ['برداشت سود از کسب‌وکار', 'سایر درآمدهای شخصی'],
          expense: [
            'قبض آب',
            'قبض برق',
            'قبض گاز',
            'قبض تلفن همراه',
            'قبض اینترنت',
            'پوشاک و خرید شخصی',
            'ورزش و سلامت',
            'تفریح، سینما و کتاب',
            'حمل‌ونقل و خودرو',
            'سایر هزینه‌های شخصی'
          ]
        }
      }
    };

    const STORAGE_KEY = 'behzad_dark_v6_zero_data';
    const AUTH_KEY = 'behzad_admin_credentials_v1';
    const SESSION_KEY = 'behzad_admin_logged_in_v1';

    const DEFAULT_AUTH = {
      username: 'admin',
      password: '1234'
    };

    const EMPTY_STATE = {
      rates: {
        gold18: 0,
        melted: 0,
        coinFull: 0,
        coinHalf: 0,
        coinQuarter: 0,
        coinGram: 0,
        usd: 0,
        eur: 0,
        try: 0,
        updatedAt: 'ثبت نشده'
      },
      accounts: [],
      transactions: [],
      debts: [],
      tasks: [],
      goals: [],
      customers: []
    };

    const formatNum = (n) => Number(n || 0).toLocaleString('fa-IR');
    const uid = (p = 'id') => `${p}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    const todayJalali = () => {
      try { return new Date().toLocaleDateString('fa-IR'); } catch { return ''; }
    };

    function App() {
      const [authCreds, setAuthCreds] = useState(() => {
        try {
          const saved = localStorage.getItem(AUTH_KEY);
          return saved ? JSON.parse(saved) : DEFAULT_AUTH;
        } catch {
          return DEFAULT_AUTH;
        }
      });

      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        try {
          return sessionStorage.getItem(SESSION_KEY) === 'true' || localStorage.getItem(SESSION_KEY) === 'true';
        } catch {
          return false;
        }
      });

      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [rememberMe, setRememberMe] = useState(true);
      const [showPass, setShowPass] = useState(false);
      const [loginError, setLoginError] = useState('');

      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? { ...EMPTY_STATE, ...JSON.parse(saved) } : EMPTY_STATE;
        } catch {
          return EMPTY_STATE;
        }
      });

      const [darkMode, setDarkMode] = useState(true);
      const [activeWs, setActiveWs] = useState('all');
      const [activeTab, setActiveTab] = useState('overview');
      const [showRates, setShowRates] = useState(true);
      const [modal, setModal] = useState(null);
      const [selectedCustomerId, setSelectedCustomerId] = useState(null);
      const [invoiceData, setInvoiceData] = useState(null);

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
      }, [data]);

      useEffect(() => {
        const html = document.documentElement;
        if (darkMode) {
          html.classList.add('dark');
          document.body.className = 'bg-[#090d16] text-slate-100';
        } else {
          html.classList.remove('dark');
          document.body.className = 'bg-slate-100 text-slate-900';
        }
      }, [darkMode]);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (loginUser.trim() === authCreds.username && loginPass === authCreds.password) {
          setIsAuthenticated(true);
          setLoginError('');
          sessionStorage.setItem(SESSION_KEY, 'true');
          if (rememberMe) {
            localStorage.setItem(SESSION_KEY, 'true');
          }
        } else {
          setLoginError('نام کاربری یا رمز عبور اشتباه است.');
        }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        setLoginUser('');
        setLoginPass('');
        sessionStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(SESSION_KEY);
      };

      const ws = WORKSPACES[activeWs] || WORKSPACES.all;

      const filtered = useMemo(() => {
        const byWs = (arr) => activeWs === 'all' ? arr : arr.filter(x => x.workspace === activeWs);
        return {
          accounts: byWs(data.accounts),
          transactions: byWs(data.transactions),
          debts: byWs(data.debts),
          tasks: byWs(data.tasks),
          goals: byWs(data.goals),
          customers: data.customers.filter(c => c.workspace === activeWs)
        };
      }, [data, activeWs]);

      const stats = useMemo(() => {
        const balance = filtered.accounts.reduce((s, a) => s + Number(a.balance || 0), 0);
        const income = filtered.transactions.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount || 0), 0);
        const expense = filtered.transactions.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0);
        const openTasks = filtered.tasks.filter(t => !t.done).length;
        const pendingDebts = filtered.debts.filter(d => d.status === 'pending').length;
        return { balance, income, expense, openTasks, pendingDebts };
      }, [filtered]);

      const handleWorkspaceChange = (id) => {
        setActiveWs(id);
        setSelectedCustomerId(null);
        if (activeTab === 'customers' && id !== 'ghaffari_gold' && id !== 'nuance') {
          setActiveTab('overview');
        }
      };

      const exportJSON = () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dashboard-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
      };

      const importJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            setData({ ...EMPTY_STATE, ...parsed });
            alert('فایل پشتیبان بازیابی شد.');
          } catch {
            alert('فایل نامعتبر است.');
          }
        };
        reader.readAsText(file);
      };

      const openGeneralInvoice = () => {
        setInvoiceData({
          title: `صورت‌حساب و گزارش مالی ${ws.name}`,
          subtitle: ws.subtitle,
          docNo: 'DOC-' + Math.floor(100000 + Math.random() * 900000),
          date: todayJalali(),
          rows: filtered.transactions.map(t => ({
            date: t.date,
            desc: `${t.category}${t.note ? ` (${t.note})` : ''}`,
            meta: t.type === 'income' ? 'درآمد / واریز' : 'هزینه / برداشت',
            amount: t.amount
          })),
          summary: [
            { label: 'مجموع درآمدها', val: `${formatNum(stats.income)} تومان` },
            { label: 'مجموع هزینه‌ها', val: `${formatNum(stats.expense)} تومان` },
            { label: 'تراز دوره', val: `${formatNum(stats.income - stats.expense)} تومان` },
            { label: 'موجودی کل حساب‌ها', val: `${formatNum(stats.balance)} تومان` }
          ]
        });
      };

      const openCustomerInvoice = (cust) => {
        const deals = cust.deals || [];
        const total = deals.reduce((s, d) => s + Number(d.totalAmount || 0), 0);
        const paid = deals.reduce((s, d) => s + Number(d.paidAmount || 0), 0);
        setInvoiceData({
          title: `فاکتور رسمی معاملات طلا — ${ws.name}`,
          subtitle: `مشتری: ${cust.name} | تلفن: ${cust.phone || '-'} | کد ملی: ${cust.nationalId || '-'}`,
          docNo: 'GLD-' + Math.floor(100000 + Math.random() * 900000),
          date: todayJalali(),
          rows: deals.map(d => ({
            date: d.date,
            desc: `${d.type === 'sell' ? 'فروش' : 'خرید'}: ${d.item} (${d.weight} گرم | عیار ${d.purity} | اجرت ${d.wagePercent}%)`,
            meta: `فی: ${formatNum(d.rate)}`,
            amount: d.totalAmount
          })),
          summary: [
            { label: 'جمع کل فاکتور', val: `${formatNum(total)} تومان` },
            { label: 'مبلغ پرداخت‌شده', val: `${formatNum(paid)} تومان` },
            { label: 'مانده حساب مشتری', val: `${formatNum(total - paid)} تومان` }
          ]
        });
      };

      // ==========================================
      // صفحه ورود ادمین (Login Screen)
      // ==========================================
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-[#090d16] text-slate-100 flex items-center justify-center p-4">
            <div className="w-full max-w-md bg-[#121927] border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
              <div className="flex flex-col items-center text-center mb-6">
                <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-lg shadow-emerald-900/40 mb-4">
                  <Icon name="shield-check" className="w-8 h-8 text-white" />
                </div>
                <h1 className="text-xl font-black text-white">ورود به پنل مدیریت</h1>
                <p className="text-xs text-slate-400 mt-1">Hideaway • Nuance • طلای غفاری</p>
              </div>

              <form onSubmit={handleLoginSubmit} className="space-y-4 text-xs">
                <div>
                  <label className="block text-slate-400 mb-1.5 font-medium">نام کاربری</label>
                  <div className="relative">
                    <input
                      type="text"
                      value={loginUser}
                      onChange={(e) => setLoginUser(e.target.value)}
                      required
                      dir="ltr"
                      placeholder="admin"
                      className="w-full bg-[#0b101b] border border-slate-700 focus:border-emerald-500 outline-none rounded-xl px-4 py-3 text-left text-white text-sm transition"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-slate-400 mb-1.5 font-medium">رمز عبور</label>
                  <div className="relative">
                    <input
                      type={showPass ? 'text' : 'password'}
                      value={loginPass}
                      onChange={(e) => setLoginPass(e.target.value)}
                      required
                      dir="ltr"
                      placeholder="••••"
                      className="w-full bg-[#0b101b] border border-slate-700 focus:border-emerald-500 outline-none rounded-xl px-4 py-3 pl-10 text-left text-white text-sm transition"
                    />
                    <button
                      type="button"
                      onClick={() => setShowPass(!showPass)}
                      className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white"
                    >
                      <Icon name={showPass ? 'eye-off' : 'eye'} className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                <div className="flex items-center justify-between pt-1">
                  <label className="flex items-center gap-2 cursor-pointer text-slate-400">
                    <input
                      type="checkbox"
                      checked={rememberMe}
                      onChange={(e) => setRememberMe(e.target.checked)}
                      className="w-4 h-4 rounded accent-emerald-500"
                    />
                    <span>مرا به خاطر بسپار</span>
                  </label>
                  <span className="text-[11px] text-slate-500">پیش‌فرض: admin / 1234</span>
                </div>

                {loginError && (
                  <div className="bg-rose-500/15 border border-rose-500/40 text-rose-300 px-3.5 py-2.5 rounded-xl text-xs font-medium text-center">
                    {loginError}
                  </div>
                )}

                <button
                  type="submit"
                  className="w-full bg-gradient-to-l from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold py-3.5 rounded-xl shadow-lg shadow-emerald-950/50 transition text-sm mt-2"
                >
                  ورود به داشبورد
                </button>
              </form>
            </div>
          </div>
        );
      }

      const navItems = [
        { id: 'overview', label: 'نمای کلی', icon: 'layout-grid' },
        { id: 'accounting', label: 'حسابداری', icon: 'arrow-left-right' },
        { id: 'accounts', label: 'حساب‌ها', icon: 'wallet' },
        { id: 'debts', label: 'اقساط و چک', icon: 'calendar-clock' },
        { id: 'goals', label: 'اهداف', icon: 'target' },
        { id: 'tasks', label: 'مدیریت کارها', icon: 'check-square' },
        ...(activeWs === 'ghaffari_gold' || activeWs === 'nuance'
          ? [{ id: 'customers', label: 'مشتریان طلا', icon: 'users' }]
          : [])
      ];

      return (
        <div className="min-h-screen pb-24 transition-colors duration-200">
          <div className="max-w-5xl mx-auto px-3.5 pt-3.5 space-y-4">

            {/* ردیف بالای انتخاب فضاهای کاری */}
            <div className="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
              {Object.values(WORKSPACES).map((item) => {
                const active = activeWs === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => handleWorkspaceChange(item.id)}
                    className={`flex items-center gap-2 whitespace-nowrap px-4 py-2.5 rounded-2xl text-xs font-bold transition-all ${
                      active
                        ? item.pillActive
                        : 'bg-[#131a29] dark:bg-[#131a29] text-slate-300 border border-slate-800 hover:border-slate-700'
                    }`}
                  >
                    <Icon name={item.icon} className="w-4 h-4" />
                    <span>{item.name}</span>
                  </button>
                );
              })}
            </div>

            {/* بنر بزرگ رنگی اصلی */}
            <div className={`bg-gradient-to-l ${ws.bannerGradient} rounded-3xl p-5 text-white shadow-xl relative overflow-hidden`}>
              <div className="flex items-start justify-between gap-3">
                <div className="flex items-center gap-3.5">
                  <div className="w-12 h-12 rounded-2xl bg-white/15 backdrop-blur-md flex items-center justify-center shrink-0">
                    <Icon name={ws.icon} className="w-6 h-6 text-white" />
                  </div>
                  <div>
                    <div className="flex flex-wrap items-center gap-2">
                      <h1 className="text-xl sm:text-2xl font-black tracking-tight">{ws.name}</h1>
                      <span className="text-[11px] bg-black/25 px-2.5 py-0.5 rounded-full text-white/90 font-medium">
                        {ws.tag}
                      </span>
                    </div>
                    <p className="text-xs text-white/80 mt-1">{ws.subtitle}</p>
                  </div>
                </div>
              </div>

              {/* ردیف دکمه‌های عملیات روی بنر */}
              <div className="flex flex-wrap items-center gap-2 mt-5">
                <button
                  onClick={() => setModal({ type: 'addTransaction' })}
                  className="flex items-center gap-1.5 bg-white text-slate-950 hover:bg-slate-100 text-xs font-extrabold px-4 py-2.5 rounded-xl shadow-md transition"
                >
                  <Icon name="plus" className="w-4 h-4" />

                            <div className="font-bold text-sm text-slate-100">{c.name}</div>
                            <div className="text-[11px] text-slate-400 mt-0.5">{c.phone || '-'} • {(c.deals || []).length} معامله</div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {selectedCust && (
                    <div className="bg-[#121927] border border-slate-800/90 rounded-2xl p-4">
                      <div className="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-800">
                        <div>
                          <h4 className="font-black text-base text-white">{selectedCust.name}</h4>
                          <p className="text-xs text-slate-400">{selectedCust.phone || '-'} | کد ملی: {selectedCust.nationalId || '-'}</p>
                        </div>
                        <div className="flex gap-2">
                          <button
                            onClick={() => setModal({ type: 'addDeal', customerId: selectedCust.id })}
                            className="text-xs bg-amber-500 text-slate-950 px-3 py-1.5 rounded-xl font-bold"
                          >
                            + ثبت معامله
                          </button>
                          <button
                            onClick={() => openCustomerInvoice(selectedCust)}
                            className="text-xs bg-slate-800 text-white px-3 py-1.5 rounded-xl font-bold"
                          >
                            📄 فاکتور PDF
                          </button>
                        </div>
                      </div>
                      <div className="mt-3 space-y-2">
                        {(selectedCust.deals || []).map(dl => (
                          <div key={dl.id} className="p-3 rounded-xl bg-[#0b101b] border border-slate-800 text-xs flex justify-between">
                            <div>
                              <div className="font-bold text-slate-200">{dl.type === 'sell' ? 'فروش:' : 'خرید:'} {dl.item} ({dl.weight} گرم)</div>
                              <div className="text-[10px] text-slate-500">{dl.date}</div>
                            </div>
                            <div className="text-left">
                              <div className="font-extrabold text-amber-400">{formatNum(dl.totalAmount)} ت</div>
                              <div className="text-[10px] text-emerald-400">پرداختی: {formatNum(dl.paidAmount)}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              );
            })()}
          </div>

          {/* نوار ناوبری ثابت پایین صفحه */}
          <nav className="fixed bottom-0 inset-x-0 bg-[#0d1320]/95 backdrop-blur-lg border-t border-slate-800/90 z-40 px-2 py-2">
            <div className="max-w-3xl mx-auto flex items-center justify-around gap-1">
              {navItems.map((nav) => {
                const active = activeTab === nav.id;
                return (
                  <button
                    key={nav.id}
                    onClick={() => setActiveTab(nav.id)}
                    className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                      active ? 'text-emerald-400' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <Icon name={nav.icon} className="w-5 h-5 mb-1" />
                    <span className="text-[10px] font-bold">{nav.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>

          {/* مودال‌های فرم */}
          {modal && (
            <ModalManager
              modal={modal}
              onClose={() => setModal(null)}
              data={data}
              setData={setData}
              activeWs={activeWs}
              ws={ws}
              setSelectedCustomerId={setSelectedCustomerId}
              authCreds={authCreds}
              setAuthCreds={setAuthCreds}
            />
          )}

          {/* مودال فاکتور PDF */}
          {invoiceData && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white text-slate-900 rounded-2xl max-w-3xl w-full p-5 shadow-2xl">
                <div className="no-print flex items-center justify-between pb-3 mb-4 border-b">
                  <span className="text-xs font-bold text-slate-600">پیش‌نمایش فاکتور رسمی</span>
                  <div className="flex gap-2">
                    <button onClick={() => window.print()} className="bg-emerald-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl">
                      🖨️ چاپ / ذخیره PDF
                    </button>
                    <button onClick={() => setInvoiceData(null)} className="bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded-xl font-bold">
                      بستن
                    </button>
                  </div>
                </div>
                <div id="printable-invoice" className="border-2 border-slate-800 rounded-xl p-5">
                  <div className="flex items-start justify-between border-b-2 border-slate-800 pb-3 mb-4">
                    <div>
                      <h2 className="text-base font-black">{invoiceData.title}</h2>
                      <p className="text-xs text-slate-600 mt-1">{invoiceData.subtitle}</p>
                    </div>
                    <div className="text-left text-xs">
                      <div>شماره: <b>{invoiceData.docNo}</b></div>
                      <div>تاریخ: <b>{invoiceData.date}</b></div>
                    </div>
                  </div>
                  <table className="w-full text-right text-xs border-collapse mb-5">
                    <thead>
                      <tr className="bg-slate-100 border-y border-slate-400">
                        <th className="py-2 px-2">ردیف</th>
                        <th className="py-2 px-2">تاریخ</th>
                        <th className="py-2 px-2">شرح</th>
                        <th className="py-2 px-2">نوع</th>
                        <th className="py-2 px-2">مبلغ (تومان)</th>
                      </tr>
                    </thead>
                    <tbody>
                      {invoiceData.rows.map((r, i) => (
                        <tr key={i} className="border-b border-slate-200">
                          <td className="py-2 px-2">{i + 1}</td>
                          <td className="py-2 px-2">{r.date}</td>
                          <td className="py-2 px-2 font-bold">{r.desc}</td>
                          <td className="py-2 px-2">{r.meta}</td>
                          <td className="py-2 px-2 font-extrabold">{formatNum(r.amount)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-300 text-xs">
                    {invoiceData.summary.map((s, idx) => (
                      <div key={idx}>
                        <div className="text-slate-500">{s.label}</div>
                        <div className="font-black mt-0.5">{s.val}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ModalManager({ modal, onClose, data, setData, activeWs, ws, setSelectedCustomerId, authCreds, setAuthCreds }) {
      const defaultWs = activeWs === 'all' ? 'personal' : activeWs;

      if (modal.type === 'changePassword') {
        const handleSaveCreds = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const newUser = fd.get('username').trim();
          const newPass = fd.get('password');
          if (!newUser || !newPass) return;
          const updated = { username: newUser, password: newPass };
          setAuthCreds(updated);
          localStorage.setItem(AUTH_KEY, JSON.stringify(updated));
          alert('نام کاربری و رمز عبور ادمین با موفقیت تغییر کرد!');
          onClose();
        };

        return (
          <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
            <div className="bg-[#121927] border border-slate-700 text-white rounded-2xl max-w-sm w-full p-5 shadow-2xl">
              <h3 className="font-bold text-base mb-1 text-amber-400">تنظیمات امنیت و ورود ادمین</h3>
              <p className="text-[11px] text-slate-400 mb-4">نام کاربری و رمز عبور جدید خود را وارد کنید</p>
              <form onSubmit={handleSaveCreds} className="space-y-3 text-xs">
                <div>
                  <label className="block text-slate-400 mb-1">نام کاربری جدید</label>
                  <input name="username" dir="ltr" defaultValue={authCreds.username} required className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5 text-left text-white" />
                </div>
                <div>
                  <label className="block text-slate-400 mb-1">رمز عبور جدید</label>
                  <input name="password" dir="ltr" defaultValue={authCreds.password} required className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5 text-left text-white" />
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-800">انصراف</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold">ذخیره تغییرات</button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      if (modal.type === 'editRates') {
        const handleSave = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          setData(d => ({
            ...d,
            rates: {
              gold18: Number(fd.get('gold18') || 0),
              melted: Number(fd.get('melted') || 0),
              coinFull: Number(fd.get('coinFull') || 0),
              coinHalf: Number(fd.get('coinHalf') || 0),
              coinQuarter: Number(fd.get('coinQuarter') || 0),
              coinGram: Number(fd.get('coinGram') || 0),
              usd: Number(fd.get('usd') || 0),
              eur: Number(fd.get('eur') || 0),
              try: Number(fd.get('try') || 0),
              updatedAt: todayJalali()
            }
          }));
          onClose();
        };
        return (
          <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
            <div className="bg-[#121927] border border-slate-700 text-white rounded-2xl max-w-lg w-full p-5 shadow-2xl">
              <h3 className="font-bold text-base mb-3 text-amber-400">تنظیم نرخ دستی تابلو طلای غفاری</h3>
              <form onSubmit={handleSave} className="grid grid-cols-2 gap-2.5 text-xs">
                {[
                  ['gold18', 'طلای ۱۸ عیار (گرم)', data.rates.gold18],
                  ['melted', 'مثقال آبشده', data.rates.melted],
                  ['coinFull', 'تمام سکه', data.rates.coinFull],
                  ['coinHalf', 'نیم سکه', data.rates.coinHalf],
                  ['coinQuarter', 'ربع سکه', data.rates.coinQuarter],
                  ['coinGram', 'سکه یک گرمی', data.rates.coinGram],
                  ['usd', 'دلار آمریکا', data.rates.usd],
                  ['eur', 'یورو اروپا', data.rates.eur],
                  ['try', 'لیر ترکیه', data.rates.try]
                ].map(([name, label, val]) => (
                  <div key={name}>
                    <label className="block text-slate-400 mb-1">{label}</label>
                    <input name={name} type="number" defaultValue={val} className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2 text-white" />
                  </div>
                ))}
                <div className="col-span-2 flex justify-end gap-2 mt-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-800">انصراف</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold">ذخیره</button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      if (modal.type === 'addAccount') {
        const handleSave = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          setData(d => ({
            ...d,
            accounts: [...d.accounts, {
              id: uid('acc'),
              workspace: fd.get('workspace'),
              name: fd.get('name'),
              bank: fd.get('bank'),
              balance: Number(fd.get('balance') || 0)
            }]
          }));
          onClose();
        };
        return (
          <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
            <div className="bg-[#121927] border border-slate-700 text-white rounded-2xl max-w-md w-full p-5 shadow-2xl">
              <h3 className="font-bold text-base mb-3">افزودن حساب بانکی یا صندوق</h3>
              <form onSubmit={handleSave} className="space-y-3 text-xs">
                <div>
                  <label className="block text-slate-400 mb-1">بخش</label>
                  <select name="workspace" defaultValue={defaultWs} className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5">
                    {['hideaway', 'nuance', 'ghaffari_gold', 'home', 'personal'].map(id => (
                      <option key={id} value={id}>{WORKSPACES[id].name}</option>
                    ))}
                  </select>
                </div>
                <div><label className="block text-slate-400 mb-1">عنوان حساب</label><input name="name" required className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" /></div>
                <div className="grid grid-cols-2 gap-2">
                  <div><label className="block text-slate-400 mb-1">نام بانک</label><input name="bank" className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" /></div>
                  <div><label className="block text-slate-400 mb-1">موجودی اولیه</label><input name="balance" type="number" defaultValue={0} className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" /></div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-800">انصراف</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-emerald-600 font-bold">ذخیره</button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      if (modal.type === 'addTransaction') {
        const [selWs, setSelWs] = useState(defaultWs);
        const [txType, setTxType] = useState('expense');
        const currentCats = WORKSPACES[selWs]?.categories[txType] || [];
        const handleSave = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const amount = Number(fd.get('amount') || 0);
          const accountId = fd.get('accountId');
          setData(d => ({
            ...d,
            transactions: [{
              id: uid('tx'),
              workspace: selWs,
              type: txType,
              category: fd.get('category'),
              amount,
              accountId,
              date: fd.get('date'),
              note: fd.get('note')
            }, ...d.transactions],
            accounts: d.accounts.map(a => a.id === accountId ? {
              ...a,
              balance: Number(a.balance || 0) + (txType === 'income' ? amount : -amount)
            } : a)
          }));
          onClose();
        };
        return (
          <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
            <div className="bg-[#121927] border border-slate-700 text-white rounded-2xl max-w-md w-full p-5 shadow-2xl">
              <h3 className="font-bold text-base mb-3">ثبت تراکنش جدید</h3>
              <form onSubmit={handleSave} className="space-y-3 text-xs">
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-slate-400 mb-1">بخش</label>
                    <select value={selWs} onChange={e => setSelWs(e.target.value)} className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5">
                      {['hideaway', 'nuance', 'ghaffari_gold', 'home', 'personal'].map(id => (
                        <option key={id} value={id}>{WORKSPACES[id].name}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">نوع</label>
                    <select value={txType} onChange={e => setTxType(e.target.value)} className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5">
                      <option value="expense">هزینه (-)</option>
                      <option value="income">درآمد (+)</option>
                    </select>
                  </div>
                </div>
                <div>
                  <label className="block text-slate-400 mb-1">دسته‌بندی</label>
                  <select name="category" className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5">
                    {currentCats.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div><label className="block text-slate-400 mb-1">مبلغ (تومان)</label><input name="amount" type="number" required className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" /></div>
                  <div>
                    <label className="block text-slate-400 mb-1">حساب</label>
                    <select name="accountId" className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5">
                      <option value="">بدون حساب</option>
                      {data.accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                    </select>
                  </div>
                </div>
                <div><label className="block text-slate-400 mb-1">تاریخ</label><input name="date" defaultValue={todayJalali()} className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" /></div>
                <div><label className="block text-slate-400 mb-1">توضیحات</label><input name="note" className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" /></div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-800">انصراف</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-emerald-600 font-bold">ثبت</button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      if (modal.type === 'addDebt' || modal.type === 'addTask' || modal.type === 'addGoal' || modal.type === 'progressGoal' || modal.type === 'addCustomer' || modal.type === 'addDeal') {
        const handleSimple = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          if (modal.type === 'addDebt') {
            setData(d => ({ ...d, debts: [{ id: uid('dbt'), workspace: fd.get('workspace'), kind: fd.get('kind'), title: fd.get('title'), person: fd.get('person'), amount: Number(fd.get('amount') || 0), dueDate: fd.get('dueDate'), status: 'pending' }, ...d.debts] }));
          } else if (modal.type === 'addTask') {
            setData(d => ({ ...d, tasks: [{ id: uid('tsk'), workspace: fd.get('workspace'), title: fd.get('title'), priority: 'urgent', dueDate: fd.get('dueDate'), done: false }, ...d.tasks] }));
          } else if (modal.type === 'addGoal') {
            setData(d => ({ ...d, goals: [{ id: uid('gl'), workspace: fd.get('workspace'), title: fd.get('title'), target: Number(fd.get('target') || 0), current: Number(fd.get('current') || 0), unit: fd.get('unit') || 'تومان', deadline: fd.get('deadline') }, ...d.goals] }));
          } else if (modal.type === 'progressGoal') {
            const delta = Number(fd.get('delta') || 0);
            setData(d => ({ ...d, goals: d.goals.map(g => g.id === modal.goalId ? { ...g, current: Number(g.current || 0) + delta } : g) }));
          } else if (modal.type === 'addCustomer') {
            const id = uid('cust');
            setData(d => ({ ...d, customers: [{ id, workspace: activeWs, name: fd.get('name'), phone: fd.get('phone'), nationalId: fd.get('nationalId'), deals: [] }, ...d.customers] }));
            setSelectedCustomerId(id);
          } else if (modal.type === 'addDeal') {
            const w = Number(fd.get('weight') || 0);
            const r = Number(fd.get('rate') || 0);
            const wp = Number(fd.get('wagePercent') || 0);
            const totalAmount = Math.round(w * r * (1 + wp / 100));
            setData(d => ({
              ...d,
              customers: d.customers.map(c => c.id === modal.customerId ? {
                ...c,
                deals: [{ id: uid('dl'), date: fd.get('date'), type: fd.get('type'), item: fd.get('item'), weight: w, purity: '750', rate: r, wagePercent: wp, totalAmount, paidAmount: Number(fd.get('paidAmount') || 0) }, ...(c.deals || [])]
              } : c)
            }));
          }
          onClose();
        };

        return (
          <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
            <div className="bg-[#121927] border border-slate-700 text-white rounded-2xl max-w-md w-full p-5 shadow-2xl">
              <form onSubmit={handleSimple} className="space-y-3 text-xs">
                {modal.type === 'addDebt' && (
                  <>
                    <h3 className="font-bold text-base mb-2">ثبت قسط / چک / بدهی</h3>
                    <select name="workspace" defaultValue={defaultWs} className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5">
                      {['hideaway', 'nuance', 'ghaffari_gold', 'home', 'personal'].map(id => <option key={id} value={id}>{WORKSPACES[id].name}</option>)}
                    </select>
                    <select name="kind" className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5">
                      <option value="installment">قسط</option><option value="check">چک</option><option value="debt">بدهی</option><option value="receivable">طلب</option>
                    </select>
                    <input name="title" required placeholder="عنوان..." className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                    <input name="amount" type="number" required placeholder="مبلغ (تومان)" className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                    <input name="dueDate" defaultValue={todayJalali()} className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                  </>
                )}
                {modal.type === 'addTask' && (
                  <>
                    <h3 className="font-bold text-base mb-2">کار جدید</h3>
                    <select name="workspace" defaultValue={defaultWs} className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5">
                      {['hideaway', 'nuance', 'ghaffari_gold', 'home', 'personal'].map(id => <option key={id} value={id}>{WORKSPACES[id].name}</option>)}
                    </select>
                    <input name="title" required placeholder="شرح کار..." className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                    <input name="dueDate" defaultValue={todayJalali()} className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                  </>
                )}
                {modal.type === 'addGoal' && (
                  <>
                    <h3 className="font-bold text-base mb-2">تعریف هدف جدید</h3>
                    <select name="workspace" defaultValue={defaultWs} className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5">
                      {['hideaway', 'nuance', 'ghaffari_gold', 'home', 'personal'].map(id => <option key={id} value={id}>{WORKSPACES[id].name}</option>)}
                    </select>
                    <input name="title" required placeholder="عنوان هدف..." className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                    <div className="grid grid-cols-3 gap-2">
                      <input name="target" type="number" required placeholder="هدف" className="bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                      <input name="current" type="number" defaultValue={0} placeholder="فعلی" className="bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                      <input name="unit" defaultValue="تومان" className="bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                    </div>
                    <input name="deadline" defaultValue="1405/12/29" className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                  </>
                )}
                {modal.type === 'progressGoal' && (
                  <>
                    <h3 className="font-bold text-base mb-2">ثبت پیشرفت جدید</h3>
                    <input name="delta" type="number" required placeholder="مقدار پیشرفت..." className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                  </>
                )}
                {modal.type === 'addCustomer' && (
                  <>
                    <h3 className="font-bold text-base mb-2">مشتری جدید ({ws.name})</h3>
                    <input name="name" required placeholder="نام و نام خانوادگی" className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                    <input name="phone" placeholder="شماره تماس" className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                    <input name="nationalId" placeholder="کد ملی" className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                  </>
                )}
                {modal.type === 'addDeal' && (
                  <>
                    <h3 className="font-bold text-base mb-2">ثبت معامله طلا</h3>
                    <select name="type" className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5">
                      <option value="sell">فروش به مشتری</option><option value="buy">خرید از مشتری</option>
                    </select>
                    <input name="item" required placeholder="شرح قطعه طلا" className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                    <div className="grid grid-cols-2 gap-2">
                      <input name="weight" type="number" step="0.01" required placeholder="وزن (گرم)" className="bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                      <input name="wagePercent" type="number" defaultValue={10} placeholder="اجرت (%)" className="bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <input name="rate" type="number" defaultValue={data.rates.gold18 || 0} required placeholder="نرخ هر گرم" className="bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                      <input name="paidAmount" type="number" required placeholder="مبلغ پرداختی" className="bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                    </div>
                    <input name="date" defaultValue={todayJalali()} className="w-full bg-[#0b101b] border border-slate-700 rounded-xl p-2.5" />
                  </>
                )}
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-800">انصراف</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-emerald-600 font-bold">ذخیره</button>
                </div>
              </form>
            </div>
          </div>
        );
      }
      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
